name: Build MoFox APK

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release:
        description: "构建 release APK 并发布 Release"
        required: false
        default: "true"
        type: boolean

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build APK (arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          channel: stable
          cache: true

      - name: Accept Android SDK licenses
        run: |
          yes | flutter doctor --android-licenses > /dev/null 2>&1 || true
          flutter config --android-sdk "$ANDROID_HOME" || true
          flutter doctor -v || true

      - name: Grant gradlew execute permission
        working-directory: app/android
        run: |
          [ -f gradlew ] && chmod +x gradlew || true

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libssl-dev unzip xz-utils

      - name: Fetch rootfs + build APK
        run: |
          python3 tools/build.py --release --fetch-rootfs --target-platform android-arm64

      - name: Show APK output
        run: ls -lh dist/*.apk || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mofox-apk
          path: dist/*.apk
          retention-days: 14

      - name: Create GitHub Release (tagged)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          body: |
            ## MoFox Android ${{ github.ref_name }}

            - ABI: arm64-v8a
            - 原生壳 + proot Linux + Debian 13 rootfs
            - APK 由 GitHub Actions 自动构建

      - name: Draft Release (main branch)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "continuous-${{ github.sha }}"
          name: "Continuous Build ${{ github.sha }}"
          files: dist/*.apk
          draft: false
          prerelease: true
          body: |
            自动构建产物 (来自 ${{ github.sha }} on main)。
            - ABI: arm64-v8a
            - 非正式 release，仅作测试下载。
